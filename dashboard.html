<html>
    <head>
        <title> Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background:linear-gradient(to right,#EFF2F7,#D0D9E8);
        }
        #welcome{
            color:#7879C9;
        }
        #admin{
            color:#7879C9;
        }
        #logout{
            margin-left:100px;
            border-color:red;
            border-radius:20px;
            padding:5px;
            width:120px;
        }
        #logout:hover{
            background-color:red;
            color:white;
        }
         #start{
            background:linear-gradient(to right,#6B6FD3,#CC7EE0);
            border-color:#6B6FD3 ;
            color:white;
            border-radius:30px;
            width:200px;
            margin-left:50px;
        }
        .card{
            border-radius:20px;
            border-color:white;
        }
        .card:hover{
            transform:translateY(10px);
        }


    </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row">
            <div class="col-md-8">
            <h3 id="welcome">🖋️ Welcome , <span id="admin">Resume Page</span></h3>
            <p>Your creative workspace <b>.</b>Build,track,and grow</p>
            </div>
            <div class="col-md-4">
                <button onclick="logout()" class="text-danger btn-sm mt-4" id="logout">Logout→</button>
            </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-4">
                    <div class="card p-4 text-center">
                        <h1> 📄</h1>
                        <h3>Resume Builder</h3>
                        <p>Craft modern, professional resumes with our intuitive builder</p>
                        <button onclick="start()" class="mt-4" id="start">Start Building →</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-4 text-center">
                        <h1> 🕒</h1>
                        <h3>History</h3>
                        <p>Acess all your previously created resumes anytime</p>
                        <button onclick="history()" class="mt-4" id="start">View History →</button>
                    </div>
                </div>
                 <div class="col-md-4">
                    <div class="card p-4 text-center">
                        <h1> 💼</h1>
                        <h3>Job Search Portal</h3>
                        <p>Explore top IT jobs and apply with your resume</p>
                        <button onclick="job()" class="mt-4" id="start">Search Jobs→</button>
                    </div>
                </div>
            </div>
            <p id="results" class="mt-5 text-center"></p>
        </div>
        <script>
          
            function logout(){
                 window.location.href = "login.html";
              
                
            }
            function start(){
                window.location.href = "resume.html";
            }
             function history(){
                window.location.href = "history.html";
            }
              function job(){
                window.location.href = "jobportal.html";
            }
        </script>

    </body>
</html>
