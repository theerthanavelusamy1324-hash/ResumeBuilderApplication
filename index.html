<html>
    <head>
        <title> Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background:linear-gradient(to right,#6B6FD3,#CC7EE0);
        }
        .card{
            width:450px;
            margin-left:350px;
            margin-top:40px;
            border-radius:20px;
        }
        h3{
            color:#6C6CD0;
        }
        #login{
            background:white;
            border-color:white;
            margin-right:40px;
            border-radius:20px;
            padding:5px;
            width:100px;
        }
        #login:hover{
             background:linear-gradient(to right,#6B6FD3,#CC7EE0);
             color:white;

        }
         #signup{
            background:white;
            border-color:white;
            border-radius:20px;
            padding:10px;
    
        }
         #signup:hover{
             background:linear-gradient(to right,#6B6FD3,#CC7EE0);
             color:white;

        }
        #user{
            margin-right:250px;
        }
         #pass{
            margin-right:300px;
        }
        #logins{
            background:linear-gradient(to right,#6B6FD3,#CC7EE0);
            border-color:#6B6FD3 ;
            color:white;
            border-radius:30px;
        }

    </style>
    </head>
    <body>
        <div class="container">
            <div class="card p-4 text-center">
                <h1>📄</h1>
                <h3> Resume Forge</h3>
                <p>Build Stunning resumes.Tracking history.Job portal</p>
                <div>
                    <button onclick="login()" id="login" class="mt-3"> Login</button>
                    <button onclick="signup()" id="signup" class="mt-3"> New User Signup</button>
                </div>
                <label class="mt-4" id="user"><b>UserName(Email)</b></label>
                <input type="email" id="mail" placeholder="you@example.com" class="form-control mt-2">
                <label class="mt-4" id="pass"><b>Password</b></label>
                <input type="password" id="password" placeholder="Password" class="form-control mt-2">
                <button onclick="logins()" id="logins" class="mt-4"> Login→</button>
                

            </div>
        </div>
        <script>
            function signup(){
                window.location.href = "signup.html";
            }
            async function logins() {
            let email = document.getElementById("mail").value;
              let password = document.getElementById("password").value;
            let response = await fetch(`http://localhost:8080/logins?email=${email}&password=${password}`,
                {
                    method:"POST"
                }
            );
            let data = await response.text();
            if(data =="success"){
                window.location.href = "dashboard.html";
            }
            else{
                alert("Invalid password");
            }
                
            }
        </script>
    </body>
</html>
